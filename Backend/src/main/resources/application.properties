# ── Server ──────────────────────────────────────────
server.port=8080

# ── MySQL Database ───────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/finio_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── JWT ──────────────────────────────────────────────
# Generate your own: openssl rand -hex 64
app.jwt.secret=5f2b3c4d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f
app.jwt.expiration=86400000

# ── CORS ─────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173

# ── Logging ──────────────────────────────────────────
logging.level.com.finio=DEBUG
logging.level.org.springframework.security=INFO
